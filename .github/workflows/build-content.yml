name: Build Dev website content

on:
  push:
    branches: [Dev]
    paths:
      - '_content/calendar-source.ics'
      - '_content/calendar.json'
      - '_content/news.json'
      - '_content/publications.json'
      - 'assets/documents/news/**'
      - 'publications-model.js'
      - 'publications.js'
      - 'news-magazine.css'
      - 'admin/publications-admin.js'
      - 'admin/publications-admin.css'
      - 'build-publications.js'
      - '_content/contacts.json'
      - '_templates/**'
      - 'content-pages.json'
      - 'import-calendar.js'
      - 'events.js'
      - 'calendar-updates.mjs'
      - 'azure-function/src/calendar-model.js'
      - 'admin/calendar-api.mjs'
      - 'build-news-pages.js'
      - 'build-content-pages.js'
      - 'build-contact-directory.js'
      - 'build-admin-auth.js'
      - 'build-search-index.js'
      - 'news.js'
      - 'admin/msal-auth.js'
      - 'admin/auth-config.mjs'
      - 'admin/api-health.mjs'
      - 'admin/api-identity.mjs'
      - 'admin/auth-tokens.mjs'
      - 'admin/auth-policy.mjs'
      - 'admin/AUTH-ARCHITECTURE.md'
      - 'admin/admin.js'
      - 'admin/admin.css'
      - 'admin/demo-dashboard.css'
      - 'admin/index.html'
      - '*.html'
      - '**/*.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-content.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: dev-content-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Dev
        uses: actions/checkout@v4
        with:
          ref: Dev
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm ci
      - name: Build calendar, articles, contacts and search index
        run: npm run build
      - name: Commit generated website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A events.json calendar-version.json news-data.json publications-data.json admin/publications-data.json parish-contact-directory.html admin/contacts-data.json admin/news-demo-data.json admin/msal-auth.bundle.js search-index.json news
          node -e "const d=require('./content-pages.json'); for (const p of d.pages) console.log(p.slug + '.html')" | while IFS= read -r page; do git add -A "$page"; done
          if git diff --cached --quiet; then
            echo "Generated website files are already current."
          else
            git commit -m "Build Dev website content [skip pages]"
            git push origin HEAD:Dev
          fi
      - name: Request Pages build of the generated Dev content
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_branch=$(gh api repos/micklehamchurch/website/pages --jq '.source.branch')
          if [ "$source_branch" != "Dev" ]; then
            echo "::error::Pages is not sourced from Dev; refusing to request a build."
            exit 1
          fi
          gh api --method POST repos/micklehamchurch/website/pages/builds --silent
          echo "Requested the existing Pages build from Dev after content generation."
