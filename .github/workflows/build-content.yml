      - '_content/news.json'
      - '_content/news-media.json'
      - 'stories-render.js'
      - 'news-stories.css'
      - 'assets/images/stories/**'
      - '_content/publications.json'
      - '_content/pews-news/**'
      - '_content/pews-news-images.json'
      - 'build-pews-news.js'
      - 'pews-news.css'
      - 'pews-news.js'
      - 'news-pews-hub.css'
      - 'assets/images/pews-news/**'
      - 'assets/documents/news/**'
      - 'publications-model.js'
      - 'publications.js'
      - 'news-magazine.css'
      - 'admin/publications-admin.js'
      - 'admin/publications-admin.css'
      - 'build-publications.js'
      - '_content/homepage-verses.json'
      - 'build-homepage-verses.js'
      - 'azure-function/src/homepage-verses-model.js'
      - 'admin/homepage-verses-api.mjs'
      - '_content/contacts.json'
      - '_content/clergy.json'
      - 'build-clergy-archive.js'
      - 'clergy-profiles.js'
      - 'clergy-render.js'
      - 'admin/clergy-*'
      - 'clergy-archive.css'
      - 'assets/images/clergy/**'
      - '_templates/**'
      - 'content-pages.json'
      - 'import-calendar.js'
      - '_sync/google-calendar.json'
      - 'build-home-next-service.js'
      - 'home-next-service-config.json'
      - 'calendar-export.js'
      - 'events.js'
      - 'calendar-updates.mjs'
      - 'azure-function/src/calendar-model.js'
      - 'azure-function/src/calendar-recurrence.js'
      - 'admin/calendar-recurrence-editor.mjs'
      - 'admin/calendar-api.mjs'
      - 'admin/contacts-api.mjs'
      - 'azure-function/src/contacts-model.js'
      - 'admin/news-api.mjs'
      - 'build-news-pages.js'
      - 'build-news-hub.js'
      - 'home-news-render.cjs'
      - 'home-news.css'
      - 'home-about.css'
      - 'home-news.js'
      - 'news-feed-model.js'
      - 'news-publication-artwork.json'
      - 'assets/images/news-artwork/**'
      - 'news-hub.js'
      - 'news-hub.css'
      - 'build-content-pages.js'
      - 'editorial-heroes.js'
      - 'editorial-heroes.css'
      - 'editorial-hero-config.cjs'
      - 'build-editorial-heroes.js'
      - 'assets/images/editorial/**'
      - 'seamless-heroes.js'
      - 'seamless-heroes.css'
      - 'pastoral-care-render.js'
      - 'pastoral-care.css'
      - 'pastoral-care.js'
      - 'funerals-render.js'
      - 'funerals.css'
      - 'assets/images/funerals/**'
      - 'baptisms-render.js'
      - 'baptisms.css'
      - 'assets/images/baptisms/**'
      - 'weddings-render.js'
      - 'weddings.css'
      - 'assets/images/weddings/**'
      - 'find-us-render.js'
      - 'find-us.css'
      - 'find-us-map.js'
      - 'build-contact-directory.js'
      - 'build-general-contacts.js'
      - 'contact-portrait.js'
      - 'contact-page.css'
      - 'build-admin-auth.js'
      - 'build-search-index.js'
      - 'build-typography-preview.js'
      - 'public-script-version.js'
      - 'parish-albums.json'
      - 'admin/photo-albums-*'
      - 'build-parish-gallery.js'
      - 'news.js'
      - 'admin/msal-auth.js'
      - 'admin/auth-config.mjs'
      - 'admin/api-health.mjs'
      - 'admin/api-identity.mjs'
      - 'admin/auth-tokens.mjs'
      - 'admin/auth-policy.mjs'
      - 'admin/AUTH-ARCHITECTURE.md'
      - 'admin/admin.js'
      - 'admin/admin.css'
      - 'admin/demo-dashboard.css'
      - 'admin/index.html'
      - '*.html'
      - '**/*.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-content.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: dev-content-build
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/Dev'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Dev
        uses: actions/checkout@v4
        with:
          ref: Dev
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm ci
      - name: Build calendar, articles, contacts and search index
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          # News/Home-preview refinements must not refresh unrelated date-sensitive service data.
          if git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" > /tmp/content-changed-paths &&
             ! grep -Ev '^(news\.html|news-feed\.json|news-feed-model\.js|news-hub\.(css|js)|home-news-render\.cjs|home-news\.(css|js)|home-about\.css|test/home-about\.test\.cjs|test/home-content\.test\.cjs|docs/home-about\.md|index\.html|test/home-news\.test\.cjs|test/parish-gallery\.test\.cjs|docs/home-news\.md|build-news-hub\.js|news-publication-artwork\.json|search-index\.json|docs/news-hub\.md|test/news-hub\.test\.cjs|assets/images/news-artwork/.*|\.github/workflows/build-content\.yml)$' /tmp/content-changed-paths; then
            node build-news-hub.js
            node build-search-index.js
            node build-typography-preview.js
          else
            npm run build
          fi
      - name: Commit generated website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A home-next-service-data.json homepage-verses.json homepage-verses-model.js calendar.ics events.json calendar-version.json news-data.json publications-data.json admin/publications-data.json parish-contact-directory.html admin/contacts-data.json admin/news-demo-data.json admin/msal-auth.bundle.js search-index.json contact.html index.html gallery.html news.html news-stories.html news those-who-have-served.html clergy-data.json our-history.html
          git add -A news-feed.json pews-news.html pews-news pews-news-data.json
          node -e "const d=require('./content-pages.json'); for (const p of d.pages) console.log(p.slug + '.html')" | while IFS= read -r page; do git add -A "$page"; done
          if git diff --cached --quiet; then
            echo "Generated website files are already current."
          else
            git commit -m "Build Dev website content [skip pages]"
            git push origin HEAD:Dev
          fi
      - name: Request Pages build of the generated Dev content
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_branch=$(gh api repos/micklehamchurch/website/pages --jq '.source.branch')
          if [ "$source_branch" != "Dev" ]; then
            echo "::error::Pages is not sourced from Dev; refusing to request a build."
            exit 1
          fi
          gh api --method POST repos/micklehamchurch/website/pages/builds --silent
          echo "Requested the existing Pages build from Dev after content generation."
