  push:
    branches: [Dev]
    paths:
      - '_content/calendar.json'
      - '_content/news.json'
      - '_content/news-media.json'
      - 'stories-render.js'
      - 'news-stories.css'
      - 'assets/images/stories/**'
      - '_content/publications.json'
      - '_content/pews-news/**'
      - '_content/pews-news-images.json'
      - 'build-pews-news.js'
      - 'pews-news.css'
      - 'pews-news.js'
      - 'news-pews-hub.css'
      - 'assets/images/pews-news/**'
      - 'assets/documents/news/**'
      - 'publications-model.js'
      - 'publications.js'
      - 'news-magazine.css'
      - 'admin/publications-admin.js'
      - 'admin/publications-admin.css'
      - 'build-publications.js'
      - '_content/homepage-verses.json'
      - 'build-homepage-verses.js'
      - 'azure-function/src/homepage-verses-model.js'
      - 'admin/homepage-verses-api.mjs'
      - '_content/contacts.json'
      - '_content/clergy.json'
      - '_content/history.json'
      - '_content/history-assets/**'
      - 'build-history-hub.js'
      - 'history-story-render.js'
      - 'our-history.css'
      - 'assets/images/history/**'
      - 'build-clergy-archive.js'
      - 'clergy-profiles.js'
      - 'clergy-render.js'
      - 'admin/clergy-*'
      - 'clergy-archive.css'
      - 'assets/images/clergy/**'
      - '_templates/**'
      - 'content-pages.json'
      - 'import-calendar.js'
      - '_sync/google-calendar.json'
      - 'build-home-next-service.js'
      - 'home-next-service-config.json'
      - 'calendar-export.js'
      - 'events.js'
      - 'calendar-updates.mjs'
      - 'azure-function/src/calendar-model.js'
      - 'azure-function/src/calendar-recurrence.js'
      - 'admin/calendar-recurrence-editor.mjs'
      - 'admin/calendar-api.mjs'
      - 'admin/contacts-api.mjs'
      - 'azure-function/src/contacts-model.js'
      - 'admin/news-api.mjs'
      - 'build-news-pages.js'
      - 'build-news-hub.js'
      - 'home-news-render.cjs'
      - 'home-news.css'
      - 'home-about.css'
      - 'home-life-events.css'
      - 'assets/images/home/life-events/**'
      - 'home-news.js'
      - 'news-feed-model.js'
      - 'news-publication-artwork.json'
      - 'assets/images/news-artwork/**'
      - 'news-hub.js'
      - 'news-hub.css'
      - 'build-content-pages.js'
      - 'editorial-heroes.js'
      - 'editorial-heroes.css'
      - 'editorial-hero-config.cjs'
      - 'build-editorial-heroes.js'
      - 'assets/images/editorial/**'
      - 'seamless-heroes.js'
      - 'seamless-heroes.css'
      - 'pastoral-care-render.js'
      - 'pastoral-care.css'
      - 'pastoral-care.js'
      - 'funerals-render.js'
      - 'funerals.css'
      - 'assets/images/funerals/**'
      - 'baptisms-render.js'
      - 'baptisms.css'
      - 'assets/images/baptisms/**'
      - 'weddings-render.js'
      - 'weddings.css'
      - 'assets/images/weddings/**'
      - 'find-us-render.js'
      - 'find-us.css'
      - 'find-us-map.js'
      - 'build-contact-directory.js'
      - 'build-general-contacts.js'
      - 'contact-portrait.js'
      - 'contact-page.css'
      - 'build-admin-auth.js'
      - 'build-search-index.js'
      - 'site.js'
      - 'public-header.js'
      - 'responsive-navigation.js'
      - 'header-navigation.css'
      - 'assets/images/navigation/**'
      - 'build-typography-preview.js'
      - 'public-script-version.js'
      - 'parish-albums.json'
      - 'admin/photo-albums-*'
      - 'build-parish-gallery.js'
      - 'news.js'
      - 'admin/msal-auth.js'
      - 'admin/auth-config.mjs'
      - 'admin/api-health.mjs'
      - 'admin/api-identity.mjs'
      - 'admin/auth-tokens.mjs'
      - 'admin/auth-policy.mjs'
      - 'admin/AUTH-ARCHITECTURE.md'
      - 'admin/admin.js'
      - 'admin/admin.css'
      - 'admin/demo-dashboard.css'
      - 'admin/index.html'
      - '*.html'
      - '**/*.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-content.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: dev-content-build
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/Dev'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Dev
        uses: actions/checkout@v4
        with:
          ref: Dev
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm ci
      - name: Build calendar, articles, contacts and search index
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          # Shared-navigation-only releases update cache keys, never regenerate page bodies
          # or date-sensitive Calendar/Home projections. Mixed content changes use the normal build.
          git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" > /tmp/navigation-changed-paths
          if ! grep -Ev '^(admin/(index\.html|photo-upload-queue\.js|photo-albums-admin\.(js|css)|photo-albums-api\.mjs|msal-auth\.bundle\.js)|azure-function/(src/photo-albums(-model)?\.js|test/photo-albums\.test\.js|test/fixtures/photo-albums-before-queue\.txt)|test/photo-upload-queue\.test\.cjs|docs/photo-upload-queue\.md|\.github/workflows/(build-content|deploy-azure-function)\.yml)$' /tmp/navigation-changed-paths; then
            node build-admin-auth.js
          elif grep -Eq '^(site\.js|public-header\.js|responsive-navigation\.js|header-navigation\.css|build-typography-preview\.js)$' /tmp/navigation-changed-paths &&
             ! grep -Ev '^([^/]+\.html|(news|pews-news)/[^/]+\.html|site\.js|public-header\.js|responsive-navigation\.js|header-navigation\.css|footer-standard\.css|homepage-verses\.js|build-typography-preview\.js|assets/images/navigation/.*|test/[^/]+\.test\.cjs|scripts/check-navigation-(hub|preservation)\.cjs|docs/navigation-hub\.md|\.github/workflows/build-content\.yml)$' /tmp/navigation-changed-paths; then
            node build-typography-preview.js
          # Homepage presentation releases rebuild only its feed preview and search projection.
          elif grep -Eq '^(index\.html|home-(editorial|life-events|news)\.css)$' /tmp/navigation-changed-paths &&
             ! grep -Ev '^(index\.html|home-news-render\.cjs|home-(editorial|life-events|news)\.css|build-clergy-archive\.js|search-index\.json|test/[^/]+\.test\.cjs|scripts/check-home-discovery-layout\.cjs|\.github/workflows/build-content\.yml)$' /tmp/navigation-changed-paths; then
            node home-news-render.cjs
            node build-search-index.js
          # News/Home-preview refinements must not refresh unrelated date-sensitive service data.
          elif git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" > /tmp/content-changed-paths &&
             ! grep -Ev '^(news\.html|news-feed\.json|news-feed-model\.js|news-hub\.(css|js)|home-news-render\.cjs|home-news\.(css|js)|home-about\.css|home-life-events\.css|assets/images/home/life-events/.*|test/home-life-events\.test\.cjs|docs/home-life-events\.md|test/home-about\.test\.cjs|test/home-content\.test\.cjs|docs/home-about\.md|index\.html|test/home-news\.test\.cjs|test/parish-gallery\.test\.cjs|docs/home-news\.md|build-news-hub\.js|news-publication-artwork\.json|search-index\.json|docs/news-hub\.md|test/news-hub\.test\.cjs|assets/images/news-artwork/.*|\.github/workflows/build-content\.yml)$' /tmp/content-changed-paths; then
            node build-news-hub.js
            node build-search-index.js
            node build-typography-preview.js
          # Preserve historical sources and update only the two related topic pages.
          elif ! git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" | grep -Ev '^(_archive-sources/history/.*|_config\.yml|content-pages\.json|build-content-pages\.js|build-history-preservation\.cjs|history-preservation\.css|church-building\.html|churchyard\.html|history-[-a-z0-9]+\.html|our-history\.html|search-index\.json|test/history-(preservation|timeline)\.test\.cjs|\.github/workflows/build-content\.yml)$'; then
            node build-history-preservation.cjs
          else
            if git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" | grep -Ev '^(_content/history\.json|_content/history-assets/.*|_templates/history-hub\.html|build-history-hub\.js|history-story-render\.js|our-history\.(html|css|js)|history-[-a-z0-9]+\.html|assets/images/history/.*|docs/history-(hub|story|direct|timeline)\.md|test/(history-hub|history-story|history-direct|history-timeline|drawer-current|our-history)\.test\.cjs|package\.json|search-index\.json|\.github/workflows/build-content\.yml)$'; then
              npm run build
            else
              node build-history-hub.js
              node build-search-index.js
              node build-typography-preview.js
            fi
          fi
      - name: Commit generated website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A home-next-service-data.json homepage-verses.json homepage-verses-model.js calendar.ics events.json calendar-version.json news-data.json publications-data.json admin/publications-data.json parish-contact-directory.html admin/contacts-data.json admin/news-demo-data.json admin/msal-auth.bundle.js search-index.json contact.html index.html gallery.html news.html news-stories.html news those-who-have-served.html clergy-data.json our-history.html
          git add -A news-feed.json pews-news.html pews-news pews-news-data.json
          git add -A -- 'history-*.html'
          node -e "const d=require('./content-pages.json'); for (const p of d.pages) console.log(p.slug + '.html')" | while IFS= read -r page; do git add -A "$page"; done
          if git diff --cached --quiet; then
            echo "Generated website files are already current."
          else
            git commit -m "Build Dev website content [skip pages]"
            git push origin HEAD:Dev
          fi
      - name: Request Pages build of the generated Dev content
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_branch=$(gh api repos/micklehamchurch/website/pages --jq '.source.branch')
          if [ "$source_branch" != "Dev" ]; then
            echo "::error::Pages is not sourced from Dev; refusing to request a build."
            exit 1
          fi
          gh api --method POST repos/micklehamchurch/website/pages/builds --silent
          echo "Requested the existing Pages build from Dev after content generation."
