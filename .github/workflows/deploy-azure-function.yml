name: Deploy Admin API to Azure (Dev only)

on:
  push:
    branches: [Dev]
    paths:
      - 'azure-function/**'
      - '.github/workflows/deploy-azure-function.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    outputs:
      deploy-ready: ${{ steps.azure-config.outputs.deploy-ready }}
    steps:
      - name: Require the Dev branch
        if: github.ref != 'refs/heads/Dev'
        run: |
          echo "::error::This workflow is restricted to the Dev branch."
          exit 1

      - name: Check Azure OIDC configuration
        id: azure-config
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_TENANT_ID" ] || [ -z "$AZURE_SUBSCRIPTION_ID" ]; then
            echo "deploy-ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Tests will run, but Azure deployment is skipped. Configure AZURE_CLIENT_ID, AZURE_TENANT_ID, and AZURE_SUBSCRIPTION_ID repository variables plus the Dev-branch federated identity in Azure."
          else
            echo "deploy-ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out Dev
        uses: actions/checkout@v4
        with:
          ref: Dev

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: azure-function/package-lock.json

      - name: Install Admin API dependencies
        working-directory: azure-function
        run: npm ci

      - name: Run Admin API tests
        working-directory: azure-function
        run: npm test

  deploy:
    needs: validate-and-test
    if: needs.validate-and-test.outputs.deploy-ready == 'true' && github.ref == 'refs/heads/Dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out Dev
        uses: actions/checkout@v4
        with:
          ref: Dev

      - name: Log in to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy only the Admin API Function App
        uses: Azure/functions-action@v1
        with:
          app-name: stmichael-church-admin-api
          package: azure-function
