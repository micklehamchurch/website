name: Production validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  production-validation:
    name: Production validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the proposed merge
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install site dependencies
        run: npm ci
      - name: Install Admin API test dependencies
        run: npm ci --prefix azure-function
      - name: Build the production site
        run: npm run build
      - name: Verify the public site package
        run: |
          node scripts/package-public-site.cjs build "$RUNNER_TEMP/public-site" https://micklehamchurch.github.io /website/ > /dev/null
          node scripts/package-public-site.cjs verify "$RUNNER_TEMP/public-site" https://micklehamchurch.github.io /website/ > /dev/null
      - name: Install Chromium for public browser validation
        run: npx playwright install --with-deps chromium
      - name: Validate navigation, homepage and footer in Chromium
        run: node scripts/check-public-browser.cjs "$RUNNER_TEMP/public-site"
      - name: Validate the site and Admin client
        run: node validate-production.cjs
      - name: Validate the Admin API with isolated fixtures
        run: npm test --prefix azure-function
